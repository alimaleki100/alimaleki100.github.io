name: Sync Medium articles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-medium.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest Medium posts
        run: |
          python - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          from html import unescape

          url = "https://medium.com/feed/@ali.maleki100"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          raw = urllib.request.urlopen(req, timeout=30).read()
          root = ET.fromstring(raw)

          ns = {"content":"http://purl.org/rss/1.0/modules/content/"}
          posts = []
          for item in root.findall("./channel/item")[:8]:
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip().split("?source=")[0]
              pub = (item.findtext("pubDate") or "").strip()
              content = item.findtext("content:encoded", default="", namespaces=ns) or ""
              text = re.sub(r"<[^>]+>", " ", content)
              text = unescape(re.sub(r"\s+", " ", text)).strip()
              # Remove title repetition and keep a compact excerpt.
              if text.lower().startswith(title.lower()):
                  text = text[len(title):].strip(" —:-")
              excerpt = text[:220].rsplit(" ",1)[0] + ("…" if len(text) > 220 else "")
              cats = [c.text.strip() for c in item.findall("category") if c.text]
              posts.append({"title": title, "url": link, "published": pub, "excerpt": excerpt, "categories": cats[:3]})

          Path("data").mkdir(exist_ok=True)
          Path("data/medium.json").write_text(json.dumps({"posts":posts}, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Commit feed update
        run: |
          if git diff --quiet data/medium.json; then
            echo "No Medium changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/medium.json
          git commit -m "Sync latest Medium articles"
          git push
